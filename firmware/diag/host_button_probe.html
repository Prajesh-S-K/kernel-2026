<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host mouse-button probe</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  #pad { height: 55vh; min-height: 220px; border: 3px solid; border-radius: 12px; display: grid; place-items: center;
         font-size: 2rem; user-select: none; }
  #pad.down { background: #b3261e; color: #fff; }
  #pad.up { background: #1b6e3c; color: #fff; }
  #log { font: 14px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin-top: 12px; }
</style>
<h1>Host mouse-button probe</h1>
<p>Park the pointer anywhere inside the box. It shows whether THIS computer currently believes the primary button is down.
This page changes nothing; it only listens. Click the box yourself to release a stuck button.</p>
<div id="pad" class="up" role="status" aria-live="polite">BUTTON UP</div>
<div id="log" aria-live="off"></div>
<script>
  const pad = document.getElementById('pad'), log = document.getElementById('log');
  let down = 0, up = 0, moves = 0, last = '';
  const t0 = performance.now();
  const stamp = () => ((performance.now() - t0) / 1000).toFixed(2).padStart(7) + ' s';
  const render = () => {
    log.textContent = `mousedown ${down}   mouseup ${up}   movement events ${moves}\n` + last;
  };
  const note = (text) => { last = `${stamp()}  ${text}\n` + last.split('\n').slice(0, 11).join('\n'); render(); };
  addEventListener('mousedown', (e) => { if (e.button === 0) { down++; pad.className = 'down'; pad.textContent = 'BUTTON DOWN'; note('primary button DOWN'); } });
  addEventListener('mouseup', (e) => { if (e.button === 0) { up++; pad.className = 'up'; pad.textContent = 'BUTTON UP'; note('primary button UP'); } });
  pad.addEventListener('mousemove', (e) => { moves++; if (moves % 20 === 0) render(); });
  render();
</script>
