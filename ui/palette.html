<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NodX Action Palette</title>
    <link rel="stylesheet" href="palette.css" />
  </head>
  <body>
    <main>
      <p class="label">EXPERIMENTAL DWELL ACTION PALETTE</p>
      <section id="banner" class="banner off" aria-live="polite">
        <strong id="bannerText">NO DATA</strong>
        <span id="bannerDetail">Keep the main companion window open.</span>
      </section>
      <section
        id="grid"
        class="grid"
        aria-label="Actions: hold the pointer still on one to select it"
      ></section>
      <p class="note" id="note"></p>
    </main>
    <script type="module" src="palette.js"></script>
  </body>
</html>
