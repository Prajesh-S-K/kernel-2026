[platformio]
src_dir = firmware/src
include_dir = core/include

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.3.6
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
extra_scripts = pre:scripts/pio_core.py

[env:esp32s3]
; Hardware GPIOs default to DISABLED (-1). Set verified START GPIOs below.
; build_flags = ${env.build_flags} -DNODX_SDA=8 -DNODX_SCL=9 ...

; PROVISIONAL, COMPILE-ONLY. Candidate ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
; memory settings. Compiling does not qualify the physical board; see BUILD_GUIDE.
; GPIOs stay DISABLED (-1) here too; candidate wiring is in BUILD_GUIDE, not in this file.
[env:esp32s3-n16r8-bench]
extends = env:esp32s3
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM

[env:esp32s3-sim]
build_flags = ${env.build_flags} -DNODX_SIMULATED=1

; ---- BENCH bring-up environments (local hardware stages; see docs/BENCH_PLAN.md) --------------------
; These set the START pin candidates SDA GPIO8, SCL GPIO9 and enable button GPIO4. They exist only for
; the breadboard and are NOT approved wiring; the released and general environments above keep every
; GPIO disabled. The buzzer stays disabled. Building is not flashing; uploading needs the confirmed USB
; port and an explicit go-ahead.
[env:bench-pins]
extends = env:esp32s3-n16r8-bench
build_flags = ${env:esp32s3-n16r8-bench.build_flags} -DNODX_SDA=8 -DNODX_SCL=9 -DNODX_ENABLE=4
              -DNODX_BUZZER=-1 -Ifirmware/diag -Ifirmware/src

; Stage 1-3: serial-only diagnostic (board facts, I2C scan, MPU6050, enable button). No BLE/HID.
[env:bench-diag]
extends = env:bench-pins
build_src_filter = -<*> +<../diag/diag_main.cpp>

; Stage 4: BLE HID probe using the real BLE adapter; sends reports only on serial command.
[env:bench-ble-probe]
extends = env:bench-pins
build_src_filter = -<*> +<../diag/ble_probe.cpp>

; Stage 5: the real firmware with the bench pins (hardware source labels, enable button, BLE mouse).
[env:bench-firmware]
extends = env:bench-pins
